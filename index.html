<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>致敬信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #d9d9d9; /* 灰色背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景金色装饰丝带 */
        .bg-decor {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-decor::before {
            content: '';
            position: absolute;
            top: -10%; right: -10%;
            width: 60%; height: 60%;
            border: 12px solid #d4af37;
            border-radius: 50%;
            transform: rotate(30deg);
            opacity: 0.4;
            filter: blur(2px);
        }
        .bg-decor::after {
            content: '';
            position: absolute;
            bottom: -20%; left: -10%;
            width: 70%; height: 70%;
            border: 16px solid #d4af37;
            border-radius: 50%;
            transform: rotate(-45deg);
            opacity: 0.3;
            filter: blur(4px);
        }

        /* 信封主容器 */
        .envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 信纸部分 */
        .letter-paper {
            background: #ffffff;
            width: 88%;
            min-height: 500px;
            padding: 40px 30px 30px 30px;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            margin-bottom: -180px; /* 让信纸插入信封 */
            display: flex;
            flex-direction: column;
        }

        /* 信纸红色边框装饰 */
        .letter-paper::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 2px solid #c62828;
            pointer-events: none;
            border-radius: 4px;
        }

        /* 信纸头部：Logo + 标题 + 花饰 */
        .letter-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 3;
        }

        /* 模拟习酒 Logo */
        .logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo-circle {
            width: 50px;
            height: 50px;
            background: #2e7d32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 6px;
            box-shadow: 0 2px 8px rgba(46,125,50,0.3);
        }
        .logo-text {
            font-size: 14px;
            color: #333;
            letter-spacing: 4px;
            font-weight: 600;
        }
        .logo-sub {
            font-size: 8px;
            color: #888;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* 致敬信 标题 */
        .main-title {
            font-size: 42px;
            color: #c62828;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 15px 0 10px 0;
            text-shadow: 0 2px 4px rgba(198,40,40,0.2);
            font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
        }

        /* 红色花饰 (模拟图片中的卷曲纹样) */
        .flourish {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            color: #c62828;
            font-size: 20px;
        }
        .flourish::before, .flourish::after {
            content: '❧';
            font-size: 18px;
            transform: scaleX(-1);
        }
        .flourish::after {
            transform: scaleX(1);
        }
        .flourish-line {
            width: 40px;
            height: 2px;
            background: #c62828;
            border-radius: 2px;
        }

        /* 信封底部 */
        .envelope-bottom {
            width: 100%;
            height: 220px;
            background: #c62828;
            position: relative;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            /* 模拟信封底部折角形状 */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            border-radius: 0 0 12px 12px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.1);
        }

        /* 信封侧翼（左右三角） */
        .envelope-bottom::before,
        .envelope-bottom::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 100%;
            background: #b71c1c;
            z-index: 4;
        }
        .envelope-bottom::before {
            left: 0;
            clip-path: polygon(0 0, 0 100%, 100% 100%);
        }
        .envelope-bottom::after {
            right: 0;
            clip-path: polygon(100% 0, 0 100%, 100% 100%);
        }

        /* 信封中间的圆形封印 */
        .envelope-seal {
            position: relative;
            z-index: 5;
            width: 80px;
            height: 80px;
            background: #c62828;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        .envelope-seal::before {
            content: '❋';
            color: #fff;
            font-size: 30px;
            opacity: 0.8;
        }
        .envelope-seal::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1px dashed rgba(255,255,255,0.5);
            border-radius: 50%;
        }

        /* 信件内容区域 */
        .letter-content {
            font-size: 17px;
            line-height: 2.0;
            color: #333333; /* 信纸上正文默认黑色 */
            word-break: break-word;
            position: relative;
            z-index: 3;
            margin-top: 10px;
        }
        .paragraph {
            text-indent: 2em;
            margin: 0;
            color: #333333;
        }
        .title-paragraph {
            text-indent: 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #c62828;
            letter-spacing: 4px;
            margin-bottom: 15px;
            display: none; /* 因为信纸头部已有大标题，隐藏正文里的标题 */
        }
        .char {
            opacity: 0;
            animation: fadeIn 0.05s forwards;
            display: inline;
        }
        .char.yellow {
            color: #d4af37; /* 金色，在白色信纸上更显眼 */
            text-shadow: 0 0 8px rgba(212,175,55,0.4);
            font-weight: 600;
        }
        .char.white {
            color: #333333; /* 信纸白底，白色字看不见，改为深色 */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #c62828;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
            opacity: 0.8;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 手机端适配 */
        @media (max-width: 640px) {
            body {
                padding: 16px 10px;
            }
            .letter-paper {
                padding: 30px 20px 20px 20px;
                min-height: 400px;
                margin-bottom: -140px;
            }
            .letter-paper::before {
                top: 8px; left: 8px; right: 8px; bottom: 8px;
            }
            .main-title {
                font-size: 32px;
                letter-spacing: 6px;
            }
            .logo-circle {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .logo-text {
                font-size: 12px;
            }
            .envelope-bottom {
                height: 170px;
            }
            .envelope-seal {
                width: 60px;
                height: 60px;
            }
            .envelope-seal::before {
                font-size: 24px;
            }
            .envelope-seal::after {
                width: 44px;
                height: 44px;
            }
            .letter-content {
                font-size: 16px;
            }
            .flourish-line {
                width: 30px;
            }
        }
        @media (max-width: 400px) {
            .letter-paper {
                padding: 24px 14px 16px 14px;
                margin-bottom: -120px;
            }
            .main-title {
                font-size: 28px;
                letter-spacing: 4px;
            }
            .envelope-bottom {
                height: 140px;
            }
            .envelope-seal {
                width: 50px;
                height: 50px;
                margin-bottom: 5px;
            }
            .envelope-seal::before {
                font-size: 20px;
            }
            .envelope-seal::after {
                width: 36px;
                height: 36px;
            }
            .letter-content {
                font-size: 15px;
            }
            .flourish {
                gap: 10px;
            }
            .flourish-line {
                width: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decor"></div>

    <!-- 信封与信纸容器 -->
    <div class="envelope-wrapper">
        <!-- 信纸 -->
        <div class="letter-paper">
            <div class="letter-header">
                <!-- 模拟习酒Logo -->
                <div class="logo-box">
                    <div class="logo-circle">习</div>
                    <div class="logo-text">贵州习酒</div>
                    <div class="logo-sub">GUIZHOU XIJIU</div>
                </div>
                <!-- 大标题 -->
                <div class="main-title">致敬信</div>
                <!-- 花饰 -->
                <div class="flourish">
                    <span class="flourish-line"></span>
                    <span>❦</span>
                    <span class="flourish-line"></span>
                </div>
            </div>
            <!-- 信件正文（逐字显示） -->
            <div class="letter-content" id="letterContent"></div>
        </div>

        <!-- 信封底部 -->
        <div class="envelope-bottom">
            <div class="envelope-seal"></div>
        </div>
    </div>

<script>
(function() {
    // ---------- 致敬信全文（[[...]] 内为黄色/金色字体） ----------
    const paragraphs = [
        // 标题在信纸头部已展示，正文不再重复标题
        { text: '亲爱的员工朋友们：', noIndent: true },
        { text: '大家好！' },
        { text: '生产复发轫，佳节又重阳。今天，我们齐聚一堂，召开2026年度生产·质量大会，系统总结过去一年的奋斗历程，共同擘画新一年的宏伟蓝图。在此，公司党委、董事会和经营班子，向辛勤耕耘在生产、质量一线的员工致以亲切的问候，向默默奋进在各条工作战线上的全体员工表达最诚挚的敬意！' },
        { text: '回首这一年，我们以专注诠释责任、以合力推动发展、以实干书写答卷，助力习酒在高质量发展和现代化建设征途中稳步前行、砥砺奋进。[[党建铸魂强引擎]]。坚持党建工作与生产经营同频共振，将党组织的凝聚力、战斗力转化为攻坚克难的硬核执行力，以高质量党建引领习酒高质量发展。[[优质优产硕果盈]]。深耕传统酿造技艺，精准执行工艺规范，严格把控质量关口，习酒品质不断超越、不断升华。[[创新赋能赢未来]]。全面推进生产流程标准化、生产过程数字化、生产装备智能化，现代科技与传统酿造深度融合，习酒"优质优产"特色生产道路越走越宽、越走越稳。[[厚植根基强人才]]。注重人才培养，营造"比学赶帮超"良好氛围，培养"精技艺、强管理、会品评"的复合型人才，持续优化习酒人才梯队结构。[[君品之道行担当]]。将君品文化内化为"日用而不觉"的行为准则，在日常工作中争当"实干者"，在危急时刻勇做"逆行者"，展现习酒人的社会责任与大爱担当。' },
        { text: '[[不经一番寒彻骨，怎得梅花扑鼻香]]' },
        { text: '回望来路，点点霜露汇聚成河。[[是你们]]，将信仰融入血脉，以坚定的态度，让生产跃动着最平稳的节奏；[[是你们]]，将星光揉进工作，以严谨的精度，让品质沉淀着最迷人的芳醇；[[是你们]]，将不懈凝于探索，以智慧的维度，让创新酝酿着最崭新的未来；[[是你们]]，将笃学化作日常，以勤奋的强度，让技能闪烁着最耀眼的光芒；[[是你们]]，将深情落在细微，以反哺的力度，让温暖延续着最幸福的价值。在此，向你们致以崇高的敬意！' },
        { text: '[[江山代有才人出，各领风骚数百年]]' },
        { text: '放怀天地，漫漫长风鼓荡作歌。[[让我们]]，以"立志欲与青云期"的魄力，在生产工作中，持续革故鼎新，谱就生产新篇章；[[让我们]]，以"莫向光阴惰寸功"的执着，在产品质量上，不断夯实基础，攀登质量新高峰；[[让我们]]，以"任尔东西南北风"的干劲，不畏艰难险阻，共筑企业梦想，为"百年习酒、世界一流"的宏伟愿景而不懈奋斗！' },
        { text: '过去一年，大家辛苦了！' },
        { text: '新的一年，让我们继续携手，同心同行，共铸辉煌！' }
    ];

    const container = document.getElementById('letterContent');
    container.innerHTML = '';

    // 为每个段落创建独立 div
    const paragraphElements = [];
    paragraphs.forEach(p => {
        const div = document.createElement('div');
        div.className = 'paragraph';
        if (p.noIndent) div.style.textIndent = '0';
        container.appendChild(div);
        paragraphElements.push(div);
    });

    // 解析 [[黄色文字]] 标记
    function parseParagraph(text) {
        const chars = [];
        let i = 0;
        let isYellow = false;
        while (i < text.length) {
            if (text.substring(i, i + 2) === '[[') {
                isYellow = true;
                i += 2;
                continue;
            }
            if (text.substring(i, i + 2) === ']]') {
                isYellow = false;
                i += 2;
                continue;
            }
            chars.push({ char: text[i], yellow: isYellow });
            i++;
        }
        return chars;
    }

    // 构建字符队列
    const queue = [];
    paragraphs.forEach((p, pi) => {
        const chars = parseParagraph(p.text);
        chars.forEach(c => {
            queue.push({
                char: c.char,
                yellow: c.yellow,
                paragraphIndex: pi
            });
        });
    });

    const total = queue.length;

    // 目标播放时长：8秒
    const TARGET_TIME = 8000;
    const baseDelay = Math.max(4, Math.floor(TARGET_TIME / total));

    let idx = 0;
    let cursorSpan = null;

    function removeCursor() {
        if (cursorSpan && cursorSpan.parentNode) {
            cursorSpan.parentNode.removeChild(cursorSpan);
        }
        cursorSpan = null;
    }

    function typeNext() {
        if (idx >= total) {
            removeCursor();
            return;
        }

        const item = queue[idx];
        const span = document.createElement('span');
        // 信纸背景是白色，所以“白色”字改为深灰色显示
        span.className = 'char ' + (item.yellow ? 'yellow' : 'white');
        span.textContent = item.char;
        span.style.animationDuration = '0.05s';

        const paraEl = paragraphElements[item.paragraphIndex];
        paraEl.appendChild(span);

        removeCursor();
        cursorSpan = document.createElement('span');
        cursorSpan.className = 'cursor';
        paraEl.appendChild(cursorSpan);

        idx++;

        if (idx < total) {
            let delay = baseDelay;
            const nextCh = queue[idx].char;
            if (['，', '。', '；', '！', '？', '、', '：'].includes(nextCh)) {
                delay += 2;
            }
            setTimeout(typeNext, delay);
        } else {
            setTimeout(removeCursor, 120);
        }
    }

    setTimeout(typeNext, 200);
})();
</script>
</body>
</html>
